# ─── Alertmanager Configuration ────────────────────────────────────────────
# Routes alerts to different channels based on severity

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'

  routes:
    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 5m

    # Warning alerts → hourly digest
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 1h

receivers:
  # ─── Default ────────────────────────────────────────────────────────────
  - name: 'default'
    # Add your notification channels here
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint'

