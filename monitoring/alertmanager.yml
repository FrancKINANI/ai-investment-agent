    #     smarthost: 'smtp.yourdomain.com:587'
    #     subject: '[WARNING] {{ .GroupLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.description }}'

# ─── Inhibition Rules ────────────────────────────────────────────────────
# Suppress warning alerts if critical alert is firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
