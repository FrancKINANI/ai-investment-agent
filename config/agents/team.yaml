    name: Decision
    layer: decision
    enabled: true
    delegate: false
    canVeto: false
    canExecute: false
    aliases: [trader]
    capabilities: [market-evidence.read, portfolio-snapshot.read, paper-proposal.compose]
    tools: [market.read, portfolio.read, proposal.write]
  - id: execution
    name: Execution
    layer: execution
    enabled: true
    delegate: false
    canVeto: false
    canExecute: true
    capabilities: [execution.adapter]
    tools: [proposal.write]
  - id: memory
    name: Memory & Lineage
    layer: memory
    enabled: true
    delegate: false
    canVeto: false
    canExecute: false
    capabilities: [memory.journal]
    tools: [portfolio.read]
